server {
    listen 8080;
    server_name elme-hyva.local;
    client_max_body_size 50M;

    set $MAGE_RUN_CODE '';
    set $MAGE_ROOT /projects/elme;
    set $MAGE_MODE developer;
    set $MAGE_RUN_TYPE website;
    set $HTTPS_FORWARD off;

    root /var/www/html/pub;
    index index.php index.html;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 32k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass elme_php:9000;
        include fastcgi_params;
        fastcgi_read_timeout 600;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ^~ /static/ {
        if ($MAGE_MODE = "production") {
            expires max;
        }

        location ~ ^/static/version {
            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
        }

        # Developer mode: the static version in the URL does not change when styles.css is rebuilt, so the
        # browser must revalidate (ETag) instead of keeping a year-old copy.
        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2|json)$ {
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN";
            expires off;

            if (!-f $request_filename) {
                rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
            }
        }

        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            add_header Cache-Control "no-store";
            add_header X-Frame-Options "SAMEORIGIN";
            expires off;

            if (!-f $request_filename) {
                rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
            }
        }

        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~* \.(css|js|map|gif|jpg|png|svg|mp4|woff|woff2|ttf|eot|otf)$ {
        expires max;
        access_log off;
    }

    location ^~ /sitemap {
        try_files $uri /media/sitemap.xml;
    }
}
