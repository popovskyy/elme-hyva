services:
  nginx:
    image: nginx:latest
    container_name: elme_nginx
    restart: always
    volumes:
      - .:/var/www/html
      - ./magento-docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mariadb
    networks:
      - elme_network

  ssl-terminator:
    image: nginx:latest
    container_name: elme_ssl
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./magento-docker/nginx/ssl-terminator.conf:/etc/nginx/conf.d/default.conf
      - ./magento-docker/certs:/etc/nginx/certificates:ro
    depends_on:
      - varnish
    networks:
      - elme_network

  varnish:
    image: varnish:latest
    container_name: elme_varnish
    restart: always
    environment:
      - VARNISH_SIZE=512M
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "80:80"
    volumes:
      - ./magento-docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - nginx
    networks:
      - elme_network

  php:
    build:
      context: .
      dockerfile: ./magento-docker/php/Dockerfile
    image: elme-php:latest
    environment:
      # off by default (fast CLI); XDEBUG_MODE=debug docker compose up -d php to debug
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 start_with_request=yes"
      PHP_IDE_CONFIG: "serverName=ElmeDocker"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: elme_php
    restart: always
    user: "1000:1000"
    volumes:
      - .:/var/www/html
      - ./magento-docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mariadb
    networks:
      - elme_network

  mariadb:
    image: mariadb:11.4
    container_name: elme_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elme_magento
      MYSQL_USER: elme
      MYSQL_PASSWORD: elme
    ports:
      - "3314:3306"
    volumes:
      - mariadb_data_elme:/var/lib/mysql
      - ./magento-docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - elme_network

  redis:
    image: valkey/valkey:8
    container_name: elme_redis
    restart: always
    command: valkey-server --appendonly yes
    volumes:
      - redis_data_elme:/data
    networks:
      - elme_network

  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: elme_opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9207:9200"
    volumes:
      - opensearch_data_elme:/usr/share/opensearch/data
    networks:
      - elme_network

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: elme_rabbitmq
    restart: always
    ports:
      - "5675:5672"
      - "15675:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - elme_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: elme_mailpit
    ports:
      - "1028:1025"
      - "8028:8025"
    restart: unless-stopped
    networks:
      - elme_network

volumes:
  mariadb_data_elme:
  redis_data_elme:
  opensearch_data_elme:

networks:
  elme_network:
